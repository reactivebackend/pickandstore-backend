apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          ports:
            - containerPort: PORT_CONTAINER

          env:
            - name: PAYMENTS_SERVICE_HOST
              valueFrom:
                secretKeyRef:
                  name: payments-mono-production-config-secret
                  key: PAYMENTS_SERVICE_HOST
            - name: PAYMENTS_SERVICE_TCP_PORT
              valueFrom:
                secretKeyRef:
                  name: payments-mono-production-config-secret
                  key: PAYMENTS_SERVICE_TCP_PORT
            - name: PAYMENTS_SERVICE_HTTP_PORT
              valueFrom:
                secretKeyRef:
                  name: payments-mono-production-config-secret
                  key: PAYMENTS_SERVICE_HTTP_PORT
            - name: STRIPE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-mono-production-config-secret
                  key: STRIPE_PUBLIC_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-mono-production-config-secret
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_EVENT_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-mono-production-config-secret
                  key: STRIPE_EVENT_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-mono-production-config-secret
                  key: DATABASE_URL
